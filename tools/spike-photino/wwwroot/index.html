<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: .5rem 1rem; font-size: 1rem; }
        .ua { color: #666; font-size: .85rem; }
        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <app>Loading…</app>

    <script>
        // JS helpers for the spike checks — kept inline so the spike stays one page.
        window.spikeUserAgent = () => navigator.userAgent;
        window.spikeCryptoDigest = async () => {
            const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("tails-spike"));
            return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
        };
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
