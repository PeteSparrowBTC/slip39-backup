# Builds the Blazor WebAssembly app and deploys it to GitHub Pages as the online demo.
#
# This workflow deploys the DEMO and nothing else. It creates no GitHub Release and
# attaches no assets. The release belongs to appimage.yml, which publishes the AppImage
# and its checksum on a v* tag, and that AppImage is the artifact meant to touch real
# seed phrases. Two workflows creating a release for the same tag was the previous
# arrangement, and it meant two places could disagree about what a release contains.
#
# TWO TRIGGERS, FOR TWO DIFFERENT REASONS
#
#   push to main   keeps the demo current with the default branch.
#
#   push of a v*   redeploys the demo at release time, so the demo page and the AppImage
#                  built from the same tag report the same version. Without this the demo
#                  silently lags behind the code: it once sat 18 minutes older than the
#                  commit that added the OpenPGP envelope, so the deployed demo produced
#                  no payload.age.gpg while main did, and that looked like a missing
#                  feature rather than a stale deployment.
#
# DELIBERATELY REMOVED, do not restore without reading this
#
#   - A zip of publish/wwwroot attached to the release. It shipped the app as loose files
#     to be served over a local HTTP server, with instructions naming a start-server.sh
#     that was never in this repository, and it told the user to point a browser at
#     127.0.0.1:9876. The AppImage replaces that route entirely: no port is bound, no
#     server runs, no browser is involved. Publishing both invited someone to pick the
#     weaker one for a real backup.
#
#   - A 30-day debug artifact of the same wwwroot, which existed only to inspect a build
#     and duplicated what the deployed page already shows.

name: demo page

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Lets a maintainer redeploy the demo without pushing anything, for example after a
  # Pages configuration change.
  workflow_dispatch:

permissions:
  # Read-only on the repository: nothing here writes code, publishes a package, or
  # creates a release. The release token lives in appimage.yml where it is needed.
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and no cancelling.
#
# A tag push and a main push do arrive together at release time: the merge moves main,
# then the tag is pushed at the same commit. With cancel-in-progress: true the second to
# arrive kills the first, and which one that is comes down to timing. Cancelling the tag
# run is the bad outcome, because that run is the one stamping the release version into
# the build, and losing it leaves the demo quietly reporting whatever
# Directory.Build.props happened to say.
#
# false queues them instead, so both finish and the later completion is what the demo
# serves. That does not guarantee the tag run wins, and nothing here can; it guarantees
# only that no deployment is destroyed by another. dice-to-seed sidesteps the race by
# deploying its demo on tags alone, a defensible different choice, and this repository
# deliberately keeps the demo tracking main between releases.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The version the UI shows comes from MSBuild. Directory.Build.props holds the
      # value every ordinary build uses; a tagged build overrides it from the tag, so
      # the demo names exactly the version that was released. Empty output means "not a
      # tag build, use the checked-in value".
      - name: Derive the version from the tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "Building as version ${GITHUB_REF_NAME#v} from tag ${GITHUB_REF_NAME}."
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "Not a tag build; using the version in Directory.Build.props."
          fi

      # The suite gates the demo as well as the AppImage. The demo is marked
      # DEMONSTRATION AND TESTING ONLY, but a broken one teaches the wrong recovery
      # procedure to whoever reads it, and people do read it before trusting the tool.
      - name: Test
        run: dotnet test Slip39Demo.slnx -c Release

      - name: Publish
        run: |
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            dotnet publish Slip39Demo.Web -c Release -o publish \
              -p:Version=${{ steps.version.outputs.value }}
          else
            dotnet publish Slip39Demo.Web -c Release -o publish
          fi

      # The app must not DEPEND on an external origin in order to load or work. That is a
      # different claim from "contains no external URL", and the first version of this step
      # asserted the second one, failed, and was wrong to. It was copied from a sibling
      # repository that has no connectivity probe.
      #
      # This app genuinely contains external URLs, and each is deliberate:
      #
      #   connectivity.js reaches gstatic, cloudflare-dns and google on purpose. That
      #   outbound request IS the airgap detector: the banner telling somebody not to type
      #   a seed on a connected machine works by trying to reach the internet and noting
      #   whether it succeeded. Forbidding those URLs would delete a safety feature.
      #
      #   independent-verify.min.js carries BSD licence and author URLs in comments. It is
      #   vendored third-party code (built from tools/independent-verify) and the URLs are
      #   never fetched.
      #
      #   _framework is the .NET WebAssembly runtime, not our code: aka.ms appears in
      #   exception text and w3.org as XML namespace identifiers.
      #
      # So the allowlist is by exact URL and exact path, not by pattern, and anything new
      # fails the build. A fourth probe endpoint appearing in connectivity.js should be a
      # decision somebody makes on purpose, not something that slips in.
      # Matching is per URL, not per line, and that distinction is load-bearing. A
      # line-filtering version of this check passed a deliberately planted
      # https://example.net/probe because it sat on the same line as an allowed endpoint,
      # and dropping the line hid it. Every URL is therefore extracted first and judged on
      # its own.
      - name: Check the published app depends on no external origin
        run: |
          set -euo pipefail

          # The probe endpoints, pinned exactly. Keep in step with
          # Slip39Demo.Web/wwwroot/connectivity.js. A new one here is a deliberate change.
          ALLOWED='^https://www\.gstatic\.com/generate_204$'
          ALLOWED="$ALLOWED"'|^https://cloudflare-dns\.com/dns-query\?name=example\.com$'
          ALLOWED="$ALLOWED"'|^https://www\.google\.com/generate_204$'
          # Loopback: the app's own instructions tell a user to serve it locally.
          ALLOWED="$ALLOWED"'|^https?://(127\.0\.0\.1|localhost)(:[0-9]+)?(/|$)'
          # The repository link on the landing page: an anchor to click on another machine.
          ALLOWED="$ALLOWED"'|^https://github\.com/PeteSparrowBTC(/|$)'
          # XML namespace identifiers, which are names rather than addresses to fetch.
          ALLOWED="$ALLOWED"'|^https?://(www\.)?w3\.org/(2000/svg|1999/xhtml|1999/xlink)'

          urls=$(grep -rIhoE "https?://[^\"'\''[:space:])>]+" publish/wwwroot \
                   --exclude-dir=_framework \
                   --exclude=independent-verify.min.js \
                 | sed 's/[.,;]*$//' | sort -u || true)

          offenders=$(printf '%s\n' "$urls" | grep -vE "$ALLOWED" | grep -v '^$' || true)

          if [ -n "$offenders" ]; then
            echo "Not on the allowlist:"
            printf '%s\n' "$offenders" | while read -r url; do
              echo "  $url"
              grep -rIn --fixed-strings "$url" publish/wwwroot \
                --exclude-dir=_framework --exclude=independent-verify.min.js \
                | sed 's/^/      /' || true
            done
            echo "::error::The published app references an external origin that is not on the allowlist. If it is deliberate, add it to this step and say why it is safe."
            exit 1
          fi
          echo "No external dependency beyond the pinned connectivity probe."

      # GitHub Pages serves this repository under /slip39-backup/, so the base href has
      # to match or every asset resolves to the wrong path and 404s.
      - name: Point base href at the Pages subpath
        run: sed -i 's|<base href="/" />|<base href="/slip39-backup/" />|' publish/wwwroot/index.html

      # Without this, Pages runs the output through Jekyll, which discards directories
      # beginning with an underscore, including _framework. The app would not start.
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No branch condition here on purpose. The old workflow deployed only for
    # refs/heads/main, which is why a v* tag never refreshed the demo.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
