name: Build and Release SLIP-39 App

# This workflow builds the Blazor WASM application and deploys to GitHub Pages
# Triggers:
# - On push to main: Builds, deploys to GitHub Pages
# - On tag push (v*): Builds, publishes, and creates a GitHub release with downloadable assets
on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.

# Permissions required for creating releases, uploading artifacts, and deploying to Pages
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup .NET SDK
      # Use .NET 8 for stability (10 might not be available on GitHub runners)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Step 3: Update target framework to .NET 8 for GitHub Actions compatibility
      - name: Update target framework
        run: |
          sed -i 's/<TargetFramework>net10.0<\/TargetFramework>/<TargetFramework>net8.0<\/TargetFramework>/' Slip39Demo.Web/Slip39Demo.Web.csproj

      # Step 4: Restore NuGet dependencies
      - name: Restore dependencies
        run: dotnet restore Slip39Demo.Web/Slip39Demo.Web.csproj

      # Step 5: Build the application
      - name: Build
        run: dotnet build Slip39Demo.Web/Slip39Demo.Web.csproj -c Release --no-restore

      # Step 6: Publish for GitHub Pages
      # Set base path for GitHub Pages deployment
      - name: Publish for GitHub Pages
        run: dotnet publish Slip39Demo.Web/Slip39Demo.Web.csproj -c Release -o publish

      # Step 7: Fix base href for GitHub Pages
      - name: Fix base href
        run: |
          sed -i 's|<base href="/" />|<base href="/Seed-Phrase-Storage-SLIP39/" />|' publish/wwwroot/index.html

      # Step 8: Add .nojekyll file
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      # Step 9: Upload artifact for GitHub Pages deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      # Step 10: Create release archive (only on tags)
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd publish/wwwroot
          zip -r ../../slip39-backup-${{ github.ref_name }}.zip .
          cd ../..

      # Step 11: Upload build artifacts (for debugging)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip39-backup-${{ github.sha }}
          path: publish/wwwroot/
          retention-days: 30

      # Step 12: Create GitHub Release (only on tags)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: slip39-backup-${{ github.ref_name }}.zip
          body: |
            # SLIP-39 Wallet Backup Tool ${{ github.ref_name }}

            ## Download and Use

            1. Download `slip39-backup-${{ github.ref_name }}.zip`
            2. Extract to USB drive
            3. On Tails Linux:
               ```bash
               cd /media/amnesia/YOUR_USB/slip39-backup
               ./start-server.sh
               ```
            4. Open Tor Browser (configure to allow localhost) to: `http://127.0.0.1:9876`

            See TAILS_INSTRUCTIONS.md for complete setup guide.

            ## What's Included

            - Complete Blazor WASM application (~27 MB)
            - 100% client-side processing
            - Works offline with Python web server
            - Includes QRCoder for share QR codes
            - Uses Xecrets.Slip39 for SLIP-39 implementation

            ## Security

            ✅ All cryptographic operations run in your browser (WebAssembly)
            ✅ No data sent to any server - verifiable in DevTools
            ✅ Safe for offline use on Tails Linux

            **Remember:** Write shares on paper/metal, not digital storage!

            *Collaboration by Claude*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to GitHub Pages
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
