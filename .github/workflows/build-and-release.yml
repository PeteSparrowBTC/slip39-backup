name: Build and Release SLIP-39 App

# This workflow builds the Blazor WASM application and deploys to GitHub Pages
# Triggers:
# - On push to main: Builds, deploys to GitHub Pages
# - On tag push (v*): Builds, publishes, and creates a GitHub release with downloadable assets
# - On pull_request to main: Builds + tests only (no deploy / no release) so PR
#   feedback runs the cross-tool age interop + bUnit + Core test suite before merge.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.
  pull_request:
    branches:
      - main

# Permissions required for creating releases, uploading artifacts, and deploying to Pages
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code (including submodules — Slip39Demo.Core
      # ProjectReferences the patched AgeSharp fork at third_party/AgeSharp; without
      # submodules: recursive the runner gets an empty third_party/ and the build
      # fails with "Age.csproj does not exist").
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Setup .NET SDK 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Restore NuGet dependencies for the whole solution
      # (Slip39Demo.Web, Slip39Demo.Core, Slip39Demo.Tests — all targeting net10.0).
      - name: Restore dependencies
        run: dotnet restore Slip39Demo.slnx

      # Step 4: Build the whole solution. Slip39Demo.Core has
      # TreatWarningsAsErrors=true so any warning breaks the build.
      - name: Build
        run: dotnet build Slip39Demo.slnx -c Release --no-restore

      # Step 4b: Run our own test suite (Slip39Demo.Tests) — Core unit tests,
      # payload schema, BIP-32 fingerprint, integration round-trip, bUnit UI.
      - name: Test
        run: dotnet test Slip39Demo.slnx -c Release --no-build --verbosity normal

      # Step 4c: Run AgeSharp's CCTV wire-format reference vectors (143 vectors
      # generated by filippo.io/age) against our patched BouncyCastle adapter.
      # These are the cross-impl interop tests — they prove our adapter decodes
      # real age v1 ciphertext produced by the Go reference. 82 pass on unpatched
      # upstream main; 61 fail (pre-existing AgeSharp bugs unrelated to the
      # cipher swap, verified via stash round-trip during the patch work). We
      # therefore tolerate ≤61 failures and fail CI only if the failure count
      # regresses (which would indicate the patch broke a vector that previously
      # passed).
      - name: AgeSharp CCTV vectors (cross-impl interop baseline check)
        run: |
          set -o pipefail
          OUTPUT=$(dotnet test third_party/AgeSharp/Age.TestKit/Age.TestKit.csproj -c Release --nologo 2>&1) || true
          echo "$OUTPUT" | tail -5
          FAILED=$(echo "$OUTPUT" | grep -oE 'Failed:[ ]+[0-9]+' | tail -1 | grep -oE '[0-9]+')
          PASSED=$(echo "$OUTPUT" | grep -oE 'Passed:[ ]+[0-9]+' | tail -1 | grep -oE '[0-9]+')
          echo "Result: passed=$PASSED failed=$FAILED  (baseline: 82 passed, 61 failed)"
          if [ -z "$FAILED" ] || [ "$FAILED" -gt 61 ]; then
            echo "::error::CCTV failure count $FAILED exceeds upstream baseline of 61 — the WASM cipher patch may have broken a previously-passing vector."
            exit 1
          fi

      # Step 5: Publish for GitHub Pages
      - name: Publish for GitHub Pages
        run: dotnet publish Slip39Demo.Web/Slip39Demo.Web.csproj -c Release -o publish

      # Step 6: Fix base href for GitHub Pages
      - name: Fix base href
        run: |
          sed -i 's|<base href="/" />|<base href="/Seed-Phrase-Storage-SLIP39/" />|' publish/wwwroot/index.html

      # Step 7: Add .nojekyll file
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      # Step 8: Upload artifact for GitHub Pages deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      # Step 9: Create release archive (only on tags)
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd publish/wwwroot
          zip -r ../../slip39-backup-${{ github.ref_name }}.zip .
          cd ../..

      # Step 10: Upload build artifacts (for debugging)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip39-backup-${{ github.sha }}
          path: publish/wwwroot/
          retention-days: 30

      # Step 11: Create GitHub Release (only on tags)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: slip39-backup-${{ github.ref_name }}.zip
          body: |
            # SLIP-39 Wallet Backup Tool ${{ github.ref_name }}

            ## Download and Use

            1. Download `slip39-backup-${{ github.ref_name }}.zip`
            2. Extract to USB drive
            3. On Tails Linux:
               ```bash
               cd /media/amnesia/YOUR_USB/slip39-backup
               ./start-server.sh
               ```
            4. Open Tor Browser (configure to allow localhost) to: `http://127.0.0.1:9876`

            See TAILS_INSTRUCTIONS.md for complete setup guide.

            ## What's Included

            - Complete Blazor WASM application (~27 MB)
            - 100% client-side processing
            - Works offline with Python web server
            - Includes QRCoder for share QR codes
            - Uses Xecrets.Slip39 for SLIP-39 implementation

            ## Security

            ✅ All cryptographic operations run in your browser (WebAssembly)
            ✅ No data sent to any server - verifiable in DevTools
            ✅ Safe for offline use on Tails Linux

            **Remember:** Write shares on paper/metal, not digital storage!

            *Collaboration by Claude*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to GitHub Pages
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
