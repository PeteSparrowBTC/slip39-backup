name: Build and Release SLIP-39 App

# This workflow builds the Blazor WASM application and deploys to GitHub Pages
# Triggers:
# - On push to main: Builds, deploys to GitHub Pages
# - On tag push (v*): Builds, publishes, and creates a GitHub release with downloadable assets
# - On pull_request to main: Builds + tests only (no deploy / no release) so PR
#   feedback runs the cross-tool age interop + bUnit + Core test suite before merge.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.
  pull_request:
    branches:
      - main

# Permissions required for creating releases, uploading artifacts, and deploying to Pages
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code. No submodules: the patched AgeSharp
      # fork that used to live at third_party/AgeSharp is gone, replaced by the
      # released AgeSharp NuGet package (see Slip39Demo.Core.csproj for why).
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup .NET SDK 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Step 3: Restore NuGet dependencies for the whole solution
      # (Slip39Demo.Web, Slip39Demo.Core, Slip39Demo.Tests — all targeting net10.0).
      - name: Restore dependencies
        run: dotnet restore Slip39Demo.slnx

      # Step 4: Build the whole solution. Slip39Demo.Core has
      # TreatWarningsAsErrors=true so any warning breaks the build.
      - name: Build
        run: dotnet build Slip39Demo.slnx -c Release --no-restore

      # Step 4b: The subprocess encryption path is only meaningfully testable
      # against a real age release, so fetch the same version the AppImage
      # bundles and point the tests at it. Without SLIP39_AGE_DIR those tests
      # skip, which would quietly leave the encryptor untested in CI. Pinned by
      # checksum for the same reason the packaging script pins it.
      - name: Fetch age for the native-encryptor tests
        run: |
          curl -fsSL -o age.tar.gz             https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  age.tar.gz" | sha256sum -c -
          tar -xzf age.tar.gz
          echo "SLIP39_AGE_DIR=$PWD/age" >> "$GITHUB_ENV"

      # Step 4c: The whole suite — Core units, payload schema, BIP-32 fingerprint,
      # integration round-trips, bUnit UI, the C2SP/CCTV age wire-format vectors,
      # the foreign-backup fixtures, and the native encryptor fetched above. Any
      # failure fails the build. This replaced an older gate that tolerated 61
      # CCTV failures, a threshold calibrated against a Windows checkout where
      # core.autocrlf had corrupted the byte-exact vectors (reported and fixed
      # upstream as pscheid92/AgeSharp#3). Those vectors now carry the -text
      # attribute, so the right expectation on every platform is zero failures.
      - name: Test
        run: dotnet test Slip39Demo.slnx -c Release --no-build --verbosity normal

      # Step 5: Publish for GitHub Pages
      - name: Publish for GitHub Pages
        run: dotnet publish Slip39Demo.Web/Slip39Demo.Web.csproj -c Release -o publish

      # Step 6: Fix base href for GitHub Pages
      - name: Fix base href
        run: |
          sed -i 's|<base href="/" />|<base href="/slip39-backup/" />|' publish/wwwroot/index.html

      # Step 7: Add .nojekyll file
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      # Step 8: Upload artifact for GitHub Pages deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      # Step 9: Create release archive (only on tags)
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd publish/wwwroot
          zip -r ../../slip39-backup-${{ github.ref_name }}.zip .
          cd ../..

      # Step 10: Upload build artifacts (for debugging)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip39-backup-${{ github.sha }}
          path: publish/wwwroot/
          retention-days: 30

      # Step 11: Create GitHub Release (only on tags)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: slip39-backup-${{ github.ref_name }}.zip
          body: |
            # SLIP-39 Wallet Backup Tool ${{ github.ref_name }}

            ## Download and Use

            1. Download `slip39-backup-${{ github.ref_name }}.zip`
            2. Extract to USB drive
            3. On Tails Linux:
               ```bash
               cd /media/amnesia/YOUR_USB/slip39-backup
               ./start-server.sh
               ```
            4. Open Tor Browser (configure to allow localhost) to: `http://127.0.0.1:9876`

            See TAILS_INSTRUCTIONS.md for complete setup guide.

            ## What's Included

            - Complete Blazor WASM application (~27 MB)
            - 100% client-side processing
            - Works offline with Python web server
            - Includes QRCoder for share QR codes
            - Uses Xecrets.Slip39 for SLIP-39 implementation

            ## Security

            ✅ All cryptographic operations run in your browser (WebAssembly)
            ✅ No data sent to any server - verifiable in DevTools
            ✅ Safe for offline use on Tails Linux

            **Remember:** Write shares on paper/metal, not digital storage!

            *Collaboration by Claude*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to GitHub Pages
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
