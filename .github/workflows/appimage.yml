# Builds the slip39-backup AppImage — the native-window (Photino/WebKitGTK),
# offline, owner-side artifact for Tails 7+. The AppImage bundles:
#   - the shared Blazor UI (Slip39Demo.UI) rendered by Photino.Blazor
#   - a self-contained .NET runtime (linux-x64)
# System libraries (webkit2gtk-4.1, gtk3, libnotify) are NOT bundled — Tails 7
# ships them (design constraint: Tails-only target, use what the OS ships).
#
# Runs on every push to main touching app code, and on demand. The artifact is
# uploaded for download/verification; releases attach it when tagged.
name: Build AppImage

on:
  # Manual trigger — build an AppImage from any branch on demand.
  workflow_dispatch:
  # Rebuild whenever app code changes on main.
  push:
    branches: [main]
    paths:
      - "Slip39Demo.Core/**"
      - "Slip39Demo.UI/**"
      - "Slip39Demo.Desktop/**"
      - "packaging/appimage/**"
      # Tests gate the artifact (see the Test step below), so a change to them
      # must rebuild it.
      - "Slip39Demo.Tests/**"
      - ".github/workflows/appimage.yml"
    # Version tags (v2.0.0, ...) build AND publish the AppImage to a GitHub Release.
    tags:
      - "v*"

# The publish step needs write access to create/attach to releases.
permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      # No submodules: the patched AgeSharp fork that used to live at
      # third_party/AgeSharp is gone, replaced by the released AgeSharp NuGet
      # package (see Slip39Demo.Core.csproj for why).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Gate the artifact on the test suite BEFORE anything is packaged.
      #
      # This workflow publishes a GitHub Release on a v* tag, and that AppImage
      # is what people run against real seed phrases on an airgapped machine. It
      # previously built, packaged and released without running a single test:
      # `dotnet test` and the age conformance vectors lived only in
      # build-and-release.yml, which does not produce this artifact. A tag push
      # could therefore ship code whose tests had never run.
      #
      # The suite covers SLIP-39 split/combine round-trips, the payload schema,
      # the BIP-32 fingerprint, the bUnit UI flows, and the C2SP/CCTV age
      # wire-format conformance vectors. It costs a few minutes; an
      # unrecoverable backup artifact costs everything.
      - name: Test (gates the released artifact)
        run: dotnet test Slip39Demo.slnx -c Release --verbosity normal

      # Mirror the Tails 7 library set so the smoke test exercises the same
      # webview stack the target machine has. xvfb provides a headless display.
      - name: Install WebKitGTK + xvfb (Tails library mirror)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libnotify4 xvfb

      # Publish the desktop shell as a self-contained linux-x64 app — the
      # target machine (Tails) needs no .NET installed. This also materializes
      # wwwroot/_content/Slip39Demo.UI (shared UI static assets).
      - name: Publish desktop app (linux-x64, self-contained)
        run: dotnet publish Slip39Demo.Desktop -c Release -r linux-x64 --self-contained -o pub-desktop

      # packaging/appimage/build-appimage.sh assembles the AppDir (AppRun,
      # .desktop, icon), enforces the Tails glibc floor on Photino.Native.so,
      # and runs appimagetool (FUSE-free mode).
      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh pub-desktop slip39-backup-x86_64.AppImage

      # Smoke test: SLIP39_SMOKE=1 makes the app exit 0 once the Blazor root
      # component has rendered inside WebKitGTK — proof that .NET, Photino,
      # the webview, and the UI assembly all load together. `timeout` guards
      # against a hang; xvfb-run provides the display GTK needs.
      - name: Smoke test AppImage (render under xvfb)
        run: |
          chmod +x slip39-backup-x86_64.AppImage
          SLIP39_SMOKE=1 timeout 60 xvfb-run -a ./slip39-backup-x86_64.AppImage --appimage-extract-and-run

      # Publish a checksum next to the artifact so users can verify the copy
      # they carry to the airgapped machine.
      - name: Checksum
        run: sha256sum slip39-backup-x86_64.AppImage | tee slip39-backup-x86_64.AppImage.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip39-backup-AppImage
          path: |
            slip39-backup-x86_64.AppImage
            slip39-backup-x86_64.AppImage.sha256

      # On a version tag (v*), publish the AppImage + checksum to a GitHub
      # Release so users have a stable, downloadable, checksum-verified artifact.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            slip39-backup-x86_64.AppImage
            slip39-backup-x86_64.AppImage.sha256
          fail_on_unmatched_files: true
          body: |
            Offline SLIP-39 + age wallet-backup tool — a single native-window
            AppImage for Tails 7+ (no browser, no server, no Tor interaction).

            **Verify before use:**
            ```
            sha256sum -c slip39-backup-x86_64.AppImage.sha256
            chmod +x slip39-backup-x86_64.AppImage
            ./slip39-backup-x86_64.AppImage
            ```
            Run it on an airgapped machine (Tails 7+) to produce real backups;
            the tool watermarks anything generated while online as INSECURE-TEST.
