# Builds the SPS-SLIP39 AppImage — the self-contained, offline, owner-side
# artifact for Tails/Linux. The AppImage bundles:
#   - the published Blazor WASM app (wwwroot)
#   - a loopback-only, self-contained Kestrel host (Slip39Demo.Host, linux-x64)
# so a user can run ONE file on an airgapped machine with nothing installed.
#
# Runs on every push to main touching app code, and on demand. The artifact is
# uploaded for download/verification; releases attach it when tagged.
name: Build AppImage

on:
  # Manual trigger — build an AppImage from any branch on demand.
  workflow_dispatch:
  # Rebuild whenever app code changes on main.
  push:
    branches: [main]
    paths:
      - "Slip39Demo.Core/**"
      - "Slip39Demo.Web/**"
      - "Slip39Demo.Host/**"
      - "packaging/appimage/**"
      - "third_party/AgeSharp/**"
      - ".github/workflows/appimage.yml"
    # Version tags (v2.0.0, ...) build AND publish the AppImage to a GitHub Release.
    tags:
      - "v*"

# The publish step needs write access to create/attach to releases.
permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      # Submodules are required: Slip39Demo.Core references the patched AgeSharp
      # fork at third_party/AgeSharp via ProjectReference.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Publish the Blazor WASM app (static files) in Release.
      - name: Publish web app
        run: dotnet publish Slip39Demo.Web -c Release -o pub-web

      # Publish the host as a single self-contained linux-x64 binary — the
      # target machine (Tails) needs no .NET installed.
      - name: Publish host (linux-x64, self-contained)
        run: dotnet publish Slip39Demo.Host -c Release -r linux-x64 -o pub-host

      # The host serves the wwwroot folder sitting next to its executable.
      - name: Assemble host + app
        run: cp -r pub-web/wwwroot pub-host/

      # packaging/appimage/build-appimage.sh assembles the AppDir (AppRun,
      # .desktop, icon) and runs appimagetool (FUSE-free mode).
      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh pub-host SPS-SLIP39-x86_64.AppImage

      # Smoke test: the AppImage must actually serve the app before we ship it.
      - name: Smoke test AppImage
        run: |
          chmod +x SPS-SLIP39-x86_64.AppImage
          SPS_PORT=9877 ./SPS-SLIP39-x86_64.AppImage --appimage-extract-and-run &
          for i in $(seq 1 25); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9877/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200"
          # deep link (SPA fallback) and the independent-verify bundle must resolve
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9877/owner)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9877/js/independent-verify.min.js)" = "200"

      # Publish a checksum next to the artifact so users can verify the copy
      # they carry to the airgapped machine.
      - name: Checksum
        run: sha256sum SPS-SLIP39-x86_64.AppImage | tee SPS-SLIP39-x86_64.AppImage.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPS-SLIP39-AppImage
          path: |
            SPS-SLIP39-x86_64.AppImage
            SPS-SLIP39-x86_64.AppImage.sha256

      # On a version tag (v*), publish the AppImage + checksum to a GitHub
      # Release so users have a stable, downloadable, checksum-verified artifact.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SPS-SLIP39-x86_64.AppImage
            SPS-SLIP39-x86_64.AppImage.sha256
          fail_on_unmatched_files: true
          body: |
            Offline SLIP-39 + age wallet-backup tool, as a single self-contained AppImage.

            **Verify before use:**
            ```
            sha256sum -c SPS-SLIP39-x86_64.AppImage.sha256
            chmod +x SPS-SLIP39-x86_64.AppImage
            ./SPS-SLIP39-x86_64.AppImage        # serves offline at http://127.0.0.1:9876
            ```
            Run it on an airgapped machine (Tails) to produce real backups; the tool
            watermarks anything generated while online as INSECURE-TEST.
